<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mis Vencimientos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#EDF1EE;--surface:#F8FAF8;--ink:#16211C;--ink-2:#53635B;--line:#D1DBD4;--accent:#0E5E5A;--on-accent:#F4FBF9;--bad:#B3261E;--bad-bg:#F8E4E1;--warn:#8F5500;--warn-bg:#F7EBD2;--ok:#2B7A4B;--ok-bg:#DFEFE5;--display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1512;--surface:#16201B;--ink:#E6EEE9;--ink-2:#9AADA3;--line:#28372F;--accent:#4FC3B8;--on-accent:#05211E;--bad:#FF8F85;--bad-bg:#3A1C19;--warn:#F0B35A;--warn-bg:#3A2B10;--ok:#6FCF97;--ok-bg:#16301F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1512;--surface:#16201B;--ink:#E6EEE9;--ink-2:#9AADA3;--line:#28372F;--accent:#4FC3B8;--on-accent:#05211E;--bad:#FF8F85;--bad-bg:#3A1C19;--warn:#F0B35A;--warn-bg:#3A2B10;--ok:#6FCF97;--ok-bg:#16301F;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}.today{margin:0;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}h1{margin:6px 0 0;font:700 40px/1.05 var(--display);letter-spacing:-.02em;text-wrap:balance}
.alert{border-radius:14px;padding:14px 16px;background:var(--ok-bg);color:var(--ink)}.alert[data-sev="bad"]{background:var(--bad-bg)}.alert[data-sev="warn"]{background:var(--warn-bg)}.alert h2{margin:0;font:600 17px/1.3 var(--display)}.alert[data-sev="bad"] h2{color:var(--bad)}.alert[data-sev="warn"] h2{color:var(--warn)}.alert[data-sev="ok"] h2{color:var(--ok)}.alert p{margin:4px 0 0;font-size:14px;overflow-wrap:anywhere}
.tools{display:flex;flex-direction:column;gap:12px}.search{width:100%;height:46px;padding:0 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.search::placeholder{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}.chip b{font:500 12px var(--mono);color:var(--ink-2)}.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.chip[aria-pressed="true"] b{color:var(--on-accent)}
.demo-note{margin:0;padding:10px 12px;border:1px dashed var(--ink-2);border-radius:12px;font-size:14px;color:var(--ink-2)}.group{display:flex;flex-direction:column;gap:8px}.group-head{margin:8px 0 0;display:flex;align-items:baseline;gap:8px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--ink-2))}.group-head span{color:var(--ink-2)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;width:100%;min-height:76px;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}.row:first-child{border-top:0}
[data-st="bad"]{--c:var(--bad);--cbg:var(--bad-bg)}[data-st="warn"]{--c:var(--warn);--cbg:var(--warn-bg)}[data-st="ok"]{--c:var(--ok);--cbg:var(--ok-bg)}.stamp{color:var(--c);background:var(--cbg);border:1.5px solid var(--c);border-radius:8px;padding:7px 4px 6px;text-align:center}.stamp .n{display:block;font:500 20px/1 var(--mono);font-variant-numeric:tabular-nums}.stamp .l{display:block;margin-top:4px;font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.txt{min-width:0;display:flex;flex-direction:column;gap:2px}.name{font-weight:600;font-size:16px;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}.date{font:400 12px/1.4 var(--mono);color:var(--ink-2)}.tag{margin-left:6px;padding:1px 6px;border:1px dashed var(--ink-2);border-radius:6px;font:500 10px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);vertical-align:2px}.none{margin:8px 0;text-align:center;color:var(--ink-2);font-size:15px}.foot{margin:0;font-size:13px;color:var(--ink-2)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));height:52px;padding:0 22px;border:0;border-radius:26px;z-index:5;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;white-space:nowrap;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:560px;max-height:94%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding-top:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}.sheet h2{margin:0;font:700 24px/1.15 var(--display);letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}.field textarea{resize:vertical}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}.btn{height:50px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:600;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.danger{color:var(--bad);border-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:30;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<main class="app"><header><p class="today" id="today"></p><h1>Vencimientos</h1></header><section class="alert" id="alert" aria-live="polite" hidden></section>
<div class="tools"><input class="search" id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto" autocomplete="off"><div class="chips" id="chips"><button class="chip" type="button" data-f="all" aria-pressed="true">Todos <b id="c-all">0</b></button><button class="chip" type="button" data-f="bad" aria-pressed="false">Vencidos <b id="c-bad">0</b></button><button class="chip" type="button" data-f="warn" aria-pressed="false">Por vencer <b id="c-warn">0</b></button><button class="chip" type="button" data-f="ok" aria-pressed="false">Al día <b id="c-ok">0</b></button></div></div>
<p class="demo-note" id="demo" hidden>Estos son productos de ejemplo para que veas cómo funciona. Desaparecen cuando agregas el tuyo.</p><div id="list"></div><p class="foot" id="foot"></p></main>
<button class="fab" id="add" type="button">+ Agregar producto</button>
<div class="scrim" id="scrim" hidden><form class="sheet" id="form" novalidate><h2 id="sheet-title">Nuevo producto</h2><div class="field"><label for="f-name">Nombre</label><input id="f-name" type="text" maxlength="80" required placeholder="Ej: Yogur natural" autocomplete="off"></div>
<div class="two"><div class="field"><label for="f-exp">Vence el</label><input id="f-exp" type="date" required></div><div class="field"><label for="f-notice">Avisar con</label><select id="f-notice"><option value="3">3 días de antelación</option><option value="7" selected>7 días de antelación</option><option value="14">14 días de antelación</option><option value="30">30 días de antelación</option></select></div></div>
<div class="two"><div class="field"><label for="f-cat">Categoría</label><select id="f-cat"></select></div><div class="field"><label for="f-qty">Cantidad</label><input id="f-qty" type="number" inputmode="numeric" min="1" max="999" value="1"></div></div>
<div class="field"><label for="f-place">Dónde lo guardas</label><input id="f-place" type="text" maxlength="60" placeholder="Refrigerador, botiquín, despensa" autocomplete="off"></div><div class="field"><label for="f-note">Notas</label><textarea id="f-note" rows="2" maxlength="300" placeholder="Marca, lote, tamaño"></textarea></div>
<p class="foot" id="form-err" hidden style="color:var(--bad)"></p><div class="actions"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn danger" type="button" id="del" hidden>Eliminar</button></div></form></div><div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
var DAY=86400000,LS="mis-vencimientos-v1",CATS=["Alimentos","Lácteos","Carnes y pescados","Congelados","Despensa","Medicamentos","Aseo del hogar","Cosmética","Otro"],GROUPS=[["bad","Vencidos"],["warn","Por vencer"],["ok","Al día"]];
var items=[],filter="all",query="",editingId=null,delArmed=false,toastTimer=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function todayUTC(){var d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())}
function parse(s){var p=String(s).split("-").map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function daysLeft(s){return Math.round((parse(s)-todayUTC())/DAY)}
function iso(ms){return new Date(ms).toISOString().slice(0,10)}
function fmt(s){return new Intl.DateTimeFormat("es-CL",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).format(new Date(parse(s)))}
function status(it){var d=daysLeft(it.expires);if(d<0)return"bad";return d<=(Number(it.notice)||7)?"warn":"ok"}
function stampOf(d){if(d<0)return{n:"−"+Math.abs(d),l:"vencido"};if(d===0)return{n:"Hoy",l:"vence"};if(d===1)return{n:"1",l:"día"};if(d>=100)return{n:String(Math.round(d/30)),l:"meses"};return{n:String(d),l:"días"}}
function demoItems(){var t=todayUTC(),rows=[["Yogur natural","Lácteos",4,-2,"Refrigerador"],["Paracetamol 500 mg","Medicamentos",1,5,"Botiquín"],["Pechuga de pollo","Carnes y pescados",2,1,"Congelador"],["Aceite de oliva","Despensa",1,38,"Despensa"],["Protector solar","Cosmética",1,120,"Baño"],["Arroz grado 1","Despensa",2,240,"Despensa"]];return rows.map(function(r,i){return{id:"demo-"+i,demo:true,name:r[0],category:r[1],qty:r[2],expires:iso(t+r[3]*DAY),notice:7,place:r[4],note:""}})}
function lsRead(){try{var v=JSON.parse(localStorage.getItem(LS)||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}}
function clean(it){return{name:String(it.name||""),category:String(it.category||"Otro"),qty:Number(it.qty)||1,expires:String(it.expires||""),notice:Number(it.notice)||7,place:String(it.place||""),note:String(it.note||""),created:Number(it.created)||Date.now()}}
function newId(){return"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function saveItem(it){var i=items.findIndex(function(x){return x.id===it.id}),full=Object.assign({id:it.id},clean(it));if(i>=0)items[i]=full;else items.push(full);lsWrite();render();return Promise.resolve()}
function removeItem(id){items=items.filter(function(x){return x.id!==id});lsWrite();render();return Promise.resolve()}
function baseItems(){return items.length?items:demoItems()}
function rowHtml(it){var d=daysLeft(it.expires),st=status(it),s=stampOf(d),qty=Number(it.qty)>1?"× "+Number(it.qty):"",meta=[it.category,qty,it.place].filter(Boolean).join(" · "),when=(d<0?"Venció el ":"Vence el ")+fmt(it.expires);return'<button class="row" type="button" data-id="'+esc(it.id)+'" data-st="'+st+'"><span class="stamp"><span class="n">'+esc(s.n)+'</span><span class="l">'+esc(s.l)+'</span></span><span class="txt"><span class="name">'+esc(it.name)+(it.demo?'<span class="tag">Ejemplo</span>':"")+'</span><span class="meta">'+esc(meta)+'</span><span class="date">'+esc(when)+'</span></span></button>'}
function plural(n,one,many){return n+" "+(n===1?one:many)}
function render(){var base=baseItems(),isDemo=!items.length;$("#today").textContent=new Intl.DateTimeFormat("es-CL",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"}).format(new Date(todayUTC()));$("#demo").hidden=!isDemo;
var by={bad:[],warn:[],ok:[]};base.forEach(function(it){by[status(it)].push(it)});Object.keys(by).forEach(function(k){by[k].sort(function(a,b){return parse(a.expires)-parse(b.expires)})});
$("#c-all").textContent=base.length;$("#c-bad").textContent=by.bad.length;$("#c-warn").textContent=by.warn.length;$("#c-ok").textContent=by.ok.length;document.querySelectorAll(".chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-f")===filter))});
var al=$("#alert"),urgent=by.bad.concat(by.warn);if(urgent.length){var parts=[];if(by.bad.length)parts.push(plural(by.bad.length,"producto vencido","productos vencidos"));if(by.warn.length)parts.push(plural(by.warn.length,"por vencer","por vencer"));var names=urgent.slice(0,3).map(function(x){return x.name}).join(", ");if(urgent.length>3)names+=" y "+(urgent.length-3)+" más";al.setAttribute("data-sev",by.bad.length?"bad":"warn");al.innerHTML="<h2>"+esc(parts.join(" · "))+"</h2><p>"+esc(names)+"</p>";al.hidden=false}else if(base.length){var next=by.ok[0];if(next){var nd=daysLeft(next.expires);al.setAttribute("data-sev","ok");al.innerHTML="<h2>Todo al día</h2><p>Próximo vencimiento: "+esc(next.name)+", "+(nd===1?"mañana":"en "+nd+" días")+".</p>";al.hidden=false}else al.hidden=true}else al.hidden=true;
var q=query.trim().toLowerCase();function match(it){return!q||(it.name+" "+(it.category||"")+" "+(it.place||"")).toLowerCase().indexOf(q)>=0}var html="";GROUPS.forEach(function(g){if(filter!=="all"&&filter!==g[0])return;var list=by[g[0]].filter(match);if(!list.length)return;html+='<section class="group" data-st="'+g[0]+'">'+(filter==="all"?'<h3 class="group-head">'+g[1]+" <span>"+list.length+"</span></h3>":"")+'<div class="rows">'+list.map(rowHtml).join("")+"</div></section>"});$("#list").innerHTML=html||'<p class="none">No hay productos en esta vista.</p>';$("#list").style.cssText="display:flex;flex-direction:column;gap:12px";$("#foot").textContent="Las alertas aparecen cada vez que abres la app. Los productos se guardan solo en este navegador."}
function toast(t){var el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},2600)}
function resetDel(){delArmed=false;$("#del").textContent="Eliminar"}
function openSheet(id){var it=id?items.find(function(x){return x.id===id}):null;editingId=it?it.id:null;resetDel();$("#form-err").hidden=true;$("#sheet-title").textContent=it?"Editar producto":"Nuevo producto";$("#f-name").value=it?it.name:"";$("#f-exp").value=it?it.expires:"";$("#f-notice").value=String(it?(Number(it.notice)||7):7);$("#f-cat").value=it?(it.category||"Otro"):CATS[0];$("#f-qty").value=it?(Number(it.qty)||1):1;$("#f-place").value=it?(it.place||""):"";$("#f-note").value=it?(it.note||""):"";$("#del").hidden=!it;$("#scrim").hidden=false;setTimeout(function(){$("#f-name").focus()},30)}
function closeSheet(){$("#scrim").hidden=true;editingId=null;$("#add").focus()}
$("#f-cat").innerHTML=CATS.map(function(c){return'<option value="'+esc(c)+'">'+esc(c)+"</option>"}).join("");
$("#form").addEventListener("submit",function(e){e.preventDefault();var err=$("#form-err"),name=$("#f-name").value.trim(),exp=$("#f-exp").value;if(!name){err.textContent="Escribe el nombre del producto.";err.hidden=false;$("#f-name").focus();return}if(!exp){err.textContent="Elige la fecha de vencimiento.";err.hidden=false;$("#f-exp").focus();return}var existing=editingId?items.find(function(x){return x.id===editingId}):null,it={id:editingId||newId(),name:name,expires:exp,notice:Number($("#f-notice").value),category:$("#f-cat").value,qty:Math.max(1,Math.min(999,parseInt($("#f-qty").value,10)||1)),place:$("#f-place").value.trim(),note:$("#f-note").value.trim(),created:existing?existing.created:Date.now()};saveItem(it).then(function(){closeSheet();toast("Producto guardado")},function(){err.textContent="No se pudo guardar. Intenta otra vez.";err.hidden=false})});
$("#cancel").addEventListener("click",closeSheet);$("#del").addEventListener("click",function(){if(!delArmed){delArmed=true;this.textContent="Toca otra vez para eliminar";setTimeout(resetDel,4000);return}var id=editingId;removeItem(id).then(function(){closeSheet();toast("Producto eliminado")},function(){var err=$("#form-err");err.textContent="No se pudo eliminar. Intenta otra vez.";err.hidden=false;resetDel()})});
$("#scrim").addEventListener("click",function(e){if(e.target===this)closeSheet()});document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#scrim").hidden)closeSheet()});$("#add").addEventListener("click",function(){openSheet(null)});
$("#list").addEventListener("click",function(e){var b=e.target.closest(".row");if(!b)return;var id=b.getAttribute("data-id");if(id.indexOf("demo-")===0)openSheet(null);else openSheet(id)});
$("#chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;filter=b.getAttribute("data-f");render()});$("#q").addEventListener("input",function(){query=this.value;render()});document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
items=lsRead();render();
})();
</script></body></html>
